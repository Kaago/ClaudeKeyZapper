[package]
name = "keyzapper-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
minisign-verify = "0.3"
base64 = "0.22"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
unicode-normalization = "0.1"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }
winreg = "0.55"
