[package]
name = "keyzapper"
version = "1.1.0"
edition = "2021"
license = "MIT"
default-run = "keyzapper"

[[bin]]
name = "keyzapper"
path = "src/main.rs"

# Bundled next to the app executable; Claude Code calls it as apiKeyHelper.
[[bin]]
name = "keyzapper-helper"
path = "src/bin/keyzapper-helper.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyzapper-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Same version Tauri uses; called directly because Tauri does not report whether an effect was applied.
window-vibrancy = "0.8"

# Windows has no system-wide "app is already running": a second start would add a second tray icon.
[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
